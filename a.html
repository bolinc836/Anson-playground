<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>四子棋彈力狂撒模擬器 - iPad直式專用</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #fdf8f4 0%, #e6dace 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    /* 全螢幕觸控區 */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      cursor: pointer;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 頂部 5 秒倒數與狀態膠囊 */
    .toast-wrapper {
      position: absolute;
      top: env(safe-area-inset-top, 24px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }

    .hint-toast {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #553e2a;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 10px 24px;
      border-radius: 30px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* 5 秒自動補滿倒數進度條 */
    .cooldown-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      width: 0%;
      background: linear-gradient(90deg, #ff4b8b, #8b38eb);
      border-radius: 2px;
      transition: width 0.04s linear;
    }

    .in-bouncing {
      background: rgba(245, 238, 230, 0.94);
      color: #8c735d;
    }

    /* 等待補球專用提示狀態 */
    .in-refilling {
      background: rgba(255, 248, 230, 0.96);
      color: #9c6800;
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <div class="toast-wrapper">
      <div class="hint-toast" id="hintToast">
        <span id="toastText">💥 輕觸畫面：狂撒彈力球！</span>
        <div class="cooldown-bar" id="cooldownBar"></div>
      </div>
    </div>
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    // --- 聲音引擎 (Web Audio API) ---
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 單顆/單批棋子從頂部落入格子的清脆敲擊卡扣聲
    function playDropClackSound(pitch = 1.0) {
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320 * pitch, now);
      osc.frequency.exponentialRampToValueAtTime(110 * pitch, now + 0.04);

      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.04);
    }

    // 補球完成慶祝音效
    function playRefillCompleteSound() {
      initAudio();
      const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
      notes.forEach((freq, idx) => {
        setTimeout(() => {
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + 0.22);
        }, idx * 90);
      });
    }

    // 彈力球狂撒聲：開閘風聲 + 前 2.5 秒密集的落地彈跳聲（隨後漸漸靜止）
    function playBouncyDumpSound() {
      initAudio();
      const now = audioCtx.currentTime;

      // 底閘抽開風聲
      const bufSize = audioCtx.sampleRate * 0.12;
      const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1600, now);
      filter.Q.setValueAtTime(3.0, now);

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.7, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      noise.start(now);

      // 前期密集彈跳，後期隨球躺平而逐漸安靜
      for (let i = 0; i < 42; i++) {
        const delay = 60 + Math.random() * 320 + i * 14;
        setTimeout(() => {
          const t = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          const freq = 220 + Math.random() * 450;
          osc.frequency.setValueAtTime(freq, t);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.3, t + 0.02);
          osc.frequency.exponentialRampToValueAtTime(60, t + 0.06);

          gain.gain.setValueAtTime(0.16, t);
          gain.gain.exponentialRampToValueAtTime(0.002, t + 0.06);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(t);
          osc.stop(t + 0.06);
        }, delay);
      }
    }

    // --- 12 × 12 專用直立式佈局 ---
    const COLS = 12;
    const ROWS = 12;
    let grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
    let scatteredDiscs = [];

    // 動態掉落補球佇列
    let fallingRefillDiscs = [];

    // 狀態機：IDLE (可按) -> BOUNCING (5秒瘋狂彈跳至躺平) -> REFILLING (耐心等待一顆顆補球掉落)
    let state = 'IDLE'; 
    const BOUNCE_DURATION = 5000; // 5 秒落地躺平時間
    let bounceStartTime = 0;

    // 補球控制
    let refillSchedule = [];
    let refillStartTime = 0;
    let totalRefillItems = 0;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hintToast = document.getElementById('hintToast');
    const toastText = document.getElementById('toastText');
    const cooldownBar = document.getElementById('cooldownBar');

    let cellSize, discRadius, boardWidth, boardHeight, boardX, boardY, floorY;
    let screenShake = 0;
    let gateOffset = 0;

    // iPad 直立式比例配置
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.scale(dpr, dpr);

      const viewW = window.innerWidth;
      const viewH = window.innerHeight;

      const maxW = viewW * 0.90;
      const maxH = viewH * 0.54;

      cellSize = Math.min(maxW / COLS, maxH / ROWS);
      discRadius = cellSize * 0.42;
      boardWidth = cellSize * COLS;
      boardHeight = cellSize * ROWS;

      boardX = (viewW - boardWidth) / 2;
      boardY = Math.max(viewH * 0.12, 60);
      floorY = viewH - Math.max(viewH * 0.05, 36);
    }
    window.addEventListener('resize', resize);

    // 粉色與紫色調配
    function getRandomColor() {
      return Math.random() > 0.5 
        ? { fill: '#ff4b8b', ring: '#ff85b3', core: '#d91d64' } 
        : { fill: '#8b38eb', ring: '#b57cfc', core: '#5b17b0' };
    }

    // 立刻填滿（僅用於首次載入）
    function initFillImmediate() {
      scatteredDiscs = [];
      fallingRefillDiscs = [];
      gateOffset = 0;
      state = 'IDLE';

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          grid[r][c] = getRandomColor();
        }
      }

      hintToast.className = 'hint-toast';
      cooldownBar.style.width = '0%';
      toastText.textContent = '💥 輕觸畫面：狂撒彈力球！';
    }

    // 開始循序補球流程：從最底排開始，一顆顆/一列列順暢由頂部落下卡入孔中
    function startProgressiveRefill() {
      state = 'REFILLING';
      scatteredDiscs = []; // 地面殘留球收乾淨
      fallingRefillDiscs = [];
      refillSchedule = [];
      refillStartTime = Date.now();

      hintToast.className = 'hint-toast in-refilling';

      // 建立由下而上、由左而右的補球序列（模擬投入棋子的等待感）
      for (let r = ROWS - 1; r >= 0; r--) {
        for (let c = 0; c < COLS; c++) {
          refillSchedule.push({ row: r, col: c });
        }
      }
      totalRefillItems = refillSchedule.length;
    }

    // 觸發：解開底閘，144 顆狂衝彈跳！
    function dumpAllBouncyBalls() {
      let count = 0;
      gateOffset = boardWidth * 0.32;

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c]) {
            const cx = boardX + c * cellSize + cellSize / 2;
            const cy = boardY + r * cellSize + cellSize / 2;

            // 初速度：有彈力球的散射衝擊感，但受控避免漫無目的永動
            const spreadX = (c - 5.5) * (cellSize * 0.08) + (Math.random() - 0.5) * 10;
            const initialVy = Math.random() * 5 + 4.5 + (ROWS - r) * 0.25;

            scatteredDiscs.push({
              x: cx,
              y: cy,
              vx: spreadX,
              vy: initialVy,
              radius: discRadius,
              colorData: grid[r][c],
              rot: Math.random() * Math.PI * 2,
              vRot: (Math.random() - 0.5) * 0.4,
              settled: false,
              // 落地微堆疊高度偏移，讓 144 顆躺地時錯落有致
              groundOffset: (Math.random() * 0.35) * discRadius
            });

            grid[r][c] = null;
            count++;
          }
        }
      }

      if (count > 0) {
        screenShake = 18;
        playBouncyDumpSound();
      }

      state = 'BOUNCING';
      bounceStartTime = Date.now();
      hintToast.className = 'hint-toast in-bouncing';
    }

    // 漸進式衰減物理引擎：前 2 秒大彈特彈，3~4 秒減速滾動，5 秒前全躺平！
    function updatePhysics() {
      const gravity = 0.78;
      const viewW = window.innerWidth;

      // 計算當前經過時間進度 (0.0 ~ 1.0)
      let progress = 0;
      if (state === 'BOUNCING') {
        const elapsed = Date.now() - bounceStartTime;
        progress = Math.min(1.0, elapsed / BOUNCE_DURATION);
      }

      // 動態彈性衰減：剛開始為 0.70（高彈力球感），隨時間迅速遞減至 0（完全不彈）
      let currentRestitution = 0.70 * Math.max(0, 1 - progress * 1.35);
      // 空氣阻力與地面摩擦力隨時間加大，促使棋子靜止躺平
      let airFriction = 0.985 - progress * 0.05;
      let groundFriction = 0.92 - progress * 0.18;

      for (let i = 0; i < scatteredDiscs.length; i++) {
        const d = scatteredDiscs[i];

        // 若已經鎖定躺平，直接保持在地表
        if (d.settled) {
          d.y = floorY - d.radius + d.groundOffset;
          d.vy = 0;
          d.vx = 0;
          d.vRot = 0;
          continue;
        }

        d.vy += gravity;
        d.x += d.vx;
        d.y += d.vy;
        d.rot += d.vRot;

        d.vx *= airFriction;

        // 碰左右牆壁彈開
        if (d.x - d.radius < 4) {
          d.x = d.radius + 4;
          d.vx = -d.vx * 0.65;
          d.vRot *= 0.8;
        } else if (d.x + d.radius > viewW - 4) {
          d.x = viewW - 4 - d.radius;
          d.vx = -d.vx * 0.65;
          d.vRot *= 0.8;
        }

        // 碰地面彈跳
        const targetFloor = floorY - d.radius + d.groundOffset;
        if (d.y >= targetFloor) {
          d.y = targetFloor;

          // 彈跳
          d.vy = -Math.abs(d.vy) * currentRestitution;
          d.vx *= groundFriction;
          d.vRot *= 0.75;

          // 判定躺平：速度低於門檻，或倒數接近尾聲（進度 > 80% 時）強制貼地躺平
          if (Math.abs(d.vy) < 1.1 || progress > 0.82) {
            d.vy = 0;
            if (Math.abs(d.vx) < 0.25 || progress > 0.88) {
              d.settled = true;
              d.vx = 0;
              d.vRot = 0;
            }
          }
        }
      }

      // 更新補球墜落動畫物理 (一顆顆或數顆從棋盤頂部落至所屬孔洞)
      for (let i = fallingRefillDiscs.length - 1; i >= 0; i--) {
        const f = fallingRefillDiscs[i];
        f.vy += 1.4; // 垂直掉落加速度
        f.y += f.vy;

        // 到達目標孔位
        if (f.y >= f.targetY) {
          f.y = f.targetY;
          grid[f.row][f.col] = f.colorData;
          playDropClackSound(0.85 + (ROWS - f.row) * 0.04);
          fallingRefillDiscs.splice(i, 1);
        }
      }

      // 震動自然衰減
      if (screenShake > 0) {
        screenShake *= 0.85;
        if (screenShake < 0.2) screenShake = 0;
      }

      // 底閘抽屜復位
      if (gateOffset > 0) {
        gateOffset *= 0.91;
        if (gateOffset < 0.4) gateOffset = 0;
      }
    }

    // 繪製粉紅/紫色雙色彈力球
    function drawDisc(x, y, radius, colorData, rot = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);

      ctx.shadowColor = 'rgba(0, 0, 0, 0.24)';
      ctx.shadowBlur = 5;
      ctx.shadowOffsetY = 3;

      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fillStyle = colorData.fill;
      ctx.fill();

      ctx.shadowColor = 'transparent';

      // 內凹刻痕圓環
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.68, 0, Math.PI * 2);
      ctx.strokeStyle = colorData.ring;
      ctx.lineWidth = Math.max(radius * 0.12, 1.8);
      ctx.stroke();

      // 核心
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.34, 0, Math.PI * 2);
      ctx.fillStyle = colorData.core;
      ctx.fill();

      // 塑膠球高光
      ctx.beginPath();
      ctx.ellipse(-radius * 0.35, -radius * 0.35, radius * 0.28, radius * 0.14, Math.PI / 4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.fill();

      ctx.restore();
    }

    // 繪製黃色棋盤與藍色立架
    function drawBoard() {
      const legThick = Math.max(cellSize * 0.3, 16);
      const legSpan = Math.max(cellSize * 0.85, 45);
      const footHeight = Math.max(cellSize * 1.7, 85);

      ctx.save();
      ctx.fillStyle = '#007acb';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 5;

      // 左側人字立架
      ctx.beginPath();
      ctx.roundRect(boardX - legThick + 2, boardY - 8, legThick, boardHeight + 16, 6);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(boardX - 2, boardY + boardHeight - 8);
      ctx.lineTo(boardX - legThick - legSpan, boardY + boardHeight + footHeight);
      ctx.lineTo(boardX - 8, boardY + boardHeight + footHeight);
      ctx.lineTo(boardX + 4, boardY + boardHeight - 8);
      ctx.fill();

      // 右側人字立架
      ctx.beginPath();
      ctx.roundRect(boardX + boardWidth - 2, boardY - 8, legThick, boardHeight + 16, 6);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(boardX + boardWidth + 2, boardY + boardHeight - 8);
      ctx.lineTo(boardX + boardWidth + legThick + legSpan, boardY + boardHeight + footHeight);
      ctx.lineTo(boardX + boardWidth + 8, boardY + boardHeight + footHeight);
      ctx.lineTo(boardX + boardWidth - 4, boardY + boardHeight - 8);
      ctx.fill();
      ctx.restore();

      // 12x12 黃色棋盤外框
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.22)';
      ctx.shadowBlur = 14;
      ctx.shadowOffsetY = 8;
      ctx.fillStyle = '#ffde3b';
      ctx.beginPath();
      ctx.roundRect(boardX, boardY, boardWidth, boardHeight, 14);
      ctx.fill();
      ctx.restore();

      // 底部開閘抽屜
      ctx.save();
      ctx.fillStyle = '#005b99';
      ctx.beginPath();
      ctx.roundRect(boardX + boardWidth * 0.38 + gateOffset, boardY + boardHeight - 4, boardWidth * 0.24, 11, 4);
      ctx.fill();
      ctx.restore();

      // 144 個孔洞與盤內彈力球
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cx = boardX + c * cellSize + cellSize / 2;
          const cy = boardY + r * cellSize + cellSize / 2;

          ctx.beginPath();
          ctx.arc(cx, cy, discRadius, 0, Math.PI * 2);
          ctx.fillStyle = '#cca91f';
          ctx.fill();

          if (grid[r][c]) {
            drawDisc(cx, cy, discRadius, grid[r][c]);
          }

          ctx.beginPath();
          ctx.arc(cx, cy, discRadius, 0, Math.PI * 2);
          ctx.strokeStyle = '#fff67b';
          ctx.lineWidth = Math.max(cellSize * 0.05, 2);
          ctx.stroke();
        }
      }
    }

    // 繪製地板
    function drawFloor() {
      const viewW = window.innerWidth;
      const viewH = window.innerHeight;

      ctx.save();
      ctx.strokeStyle = '#c6b69b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, floorY);
      ctx.lineTo(viewW, floorY);
      ctx.stroke();

      const grad = ctx.createLinearGradient(0, floorY, 0, viewH);
      grad.addColorStop(0, 'rgba(202, 186, 160, 0.35)');
      grad.addColorStop(1, 'rgba(170, 153, 126, 0.7)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, floorY, viewW, viewH - floorY);
      ctx.restore();
    }

    // 流程與倒數控制：彈跳 (5秒) -> 依序補球 (訓練等待) -> 補滿就緒
    function handleStateController() {
      if (state === 'BOUNCING') {
        const elapsed = Date.now() - bounceStartTime;
        const remainingMs = Math.max(0, BOUNCE_DURATION - elapsed);
        const remainingSec = Math.ceil(remainingMs / 1000);
        const percent = Math.min(100, (elapsed / BOUNCE_DURATION) * 100);

        cooldownBar.style.width = `${percent}%`;

        // 狀態提示：彈跳中 -> 躺平沉澱 -> 準備補球
        if (elapsed < 2800) {
          toastText.textContent = `🎾 彈力四射中... (${remainingSec}s)`;
        } else {
          toastText.textContent = `💤 全員躺平中... 準備補球 (${remainingSec}s)`;
        }

        // 滿 5 秒：準時切入「一顆顆補球動畫」
        if (elapsed >= BOUNCE_DURATION) {
          startProgressiveRefill();
        }
      } 
      else if (state === 'REFILLING') {
        // 每次循環釋放少量棋子，產生有節奏感的「投入與卡扣」等待過程
        const speed = 2; // 每個 frame 釋放 2 顆，速度適中、有視覺節奏
        for (let k = 0; k < speed && refillSchedule.length > 0; k++) {
          const item = refillSchedule.shift();
          const targetX = boardX + item.col * cellSize + cellSize / 2;
          const targetY = boardY + item.row * cellSize + cellSize / 2;

          fallingRefillDiscs.push({
            x: targetX,
            y: boardY - discRadius * 2 - (k * cellSize * 0.5), // 從棋盤頂部掉進來
            targetY: targetY,
            vy: 3.5,
            row: item.row,
            col: item.col,
            colorData: getRandomColor()
          });
        }

        // 計算目前補球進度百分比
        const finishedCount = totalRefillItems - refillSchedule.length - fallingRefillDiscs.length;
        const refillPercent = Math.min(100, Math.floor((finishedCount / totalRefillItems) * 100));

        cooldownBar.style.width = `${refillPercent}%`;
        toastText.textContent = `⏳ 耐心等待補球中... ${refillPercent}%`;

        // 全數落入就位
        if (refillSchedule.length === 0 && fallingRefillDiscs.length === 0) {
          state = 'IDLE';
          hintToast.className = 'hint-toast';
          cooldownBar.style.width = '0%';
          toastText.textContent = '🎉 補滿完成！輕觸畫面狂撒！';
          playRefillCompleteSound();
        }
      }
    }

    // 主渲染回圈
    function loop() {
      ctx.save();

      if (screenShake > 0) {
        const sx = (Math.random() - 0.5) * screenShake;
        const sy = (Math.random() - 0.5) * screenShake;
        ctx.translate(sx, sy);
      }

      ctx.clearRect(-30, -30, window.innerWidth + 60, window.innerHeight + 60);

      drawFloor();

      updatePhysics();

      // 地面上散落的彈力球
      for (let i = 0; i < scatteredDiscs.length; i++) {
        const d = scatteredDiscs[i];
        drawDisc(d.x, d.y, d.radius, d.colorData, d.rot);
      }

      // 落下過程中的補球
      for (let i = 0; i < fallingRefillDiscs.length; i++) {
        const f = fallingRefillDiscs[i];
        drawDisc(f.x, f.y, discRadius, f.colorData, 0);
      }

      drawBoard();

      ctx.restore();

      handleStateController();

      requestAnimationFrame(loop);
    }

    // 點擊觸發：僅在 IDLE 狀態下可按；彈跳與補球過程中鎖定點擊，引導耐心等待
    document.getElementById('canvas-container').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      initAudio();

      if (state !== 'IDLE') return; // 鎖定狀態，不可搶按
      dumpAllBouncyBalls();
    });

    window.onload = () => {
      resize();
      initFillImmediate();
      requestAnimationFrame(loop);
    };
  </script>
</body>
</html>
